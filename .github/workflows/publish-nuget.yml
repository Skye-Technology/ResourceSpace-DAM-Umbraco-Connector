name: Build, Test & Publish NuGet

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_to_nuget:
        description: 'Publish packed package to NuGet.org via Trusted Publishing (OIDC)'
        required: false
        default: false
        type: boolean
      nuget_user:
        description: 'NuGet.org username or organization (optional if NUGET_USER repo variable is set)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build-and-pack:
    name: Build, Test & Pack (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/SkyeTechnology.Umbraco.ResourceSpace/Client/package-lock.json

      - name: Build Bellissima Backoffice Client
        working-directory: src/SkyeTechnology.Umbraco.ResourceSpace/Client
        run: |
          npm ci
          npm run build

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SkyeTechnology.Umbraco.ResourceSpace.sln

      - name: Run xUnit tests
        run: dotnet test tests/SkyeTechnology.Umbraco.ResourceSpace.Tests/SkyeTechnology.Umbraco.ResourceSpace.Tests.csproj -c Release --no-restore --verbosity normal

      - name: Resolve package version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack NuGet package (.nupkg & .snupkg)
        run: |
          if [[ -n "${{ steps.version.outputs.value }}" ]]; then
            dotnet pack src/SkyeTechnology.Umbraco.ResourceSpace/SkyeTechnology.Umbraco.ResourceSpace.csproj -c Release --no-restore -o ./artifacts -p:Version=${{ steps.version.outputs.value }}
          else
            dotnet pack src/SkyeTechnology.Umbraco.ResourceSpace/SkyeTechnology.Umbraco.ResourceSpace.csproj -c Release --no-restore -o ./artifacts
          fi

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          if-no-files-found: error

  publish-nuget:
    name: Publish to NuGet.org (Trusted Publishing)
    needs: build-and-pack
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_to_nuget == true)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download NuGet artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Authenticate with NuGet.org via OIDC Trusted Publishing
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ inputs.nuget_user || vars.NUGET_USER || 'skye.technology' }}

      - name: Push package & symbols to NuGet.org
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
